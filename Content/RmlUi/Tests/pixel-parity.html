<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e8edf3; color: #172033; font-family: LatoLatin; font-size: 16px; }
    #stage { position: relative; width: 720px; height: 420px; }
    #panel { position: absolute; left: 48px; top: 38px; width: 624px; height: 344px; padding: 24px; background: #ffffff; }
    #header { height: 62px; padding: 8px 12px; background: #dce8f5; }
    #title { margin: 0; color: #18324a; font-size: 24px; font-weight: normal; line-height: 28px; }
    #subtitle { margin: 5px 0 0 0; color: #46627a; font-size: 14px; line-height: 17px; }
    #grid { display: grid; grid-template-columns: 168px 168px 168px; grid-template-rows: 116px; gap: 12px; margin-top: 18px; }
    .tile { position: relative; height: 116px; padding: 16px; color: #ffffff; }
    #tile-a { background: #176b87; }
    #tile-b { background: #b94d3c; }
    #tile-c { background: #477a4b; }
    .tile-label { margin: 0; font-size: 18px; line-height: 22px; }
    .tile-value { margin: 12px 0 0 0; font-size: 30px; line-height: 34px; }
    #clip-outer { position: absolute; left: 114px; top: 76px; width: 38px; height: 24px; overflow: hidden; }
    #clip-inner { position: relative; width: 30px; height: 18px; overflow: hidden; }
    #clip-strip { width: 45px; height: 3px; background: #18324a; }
    #transform-chip { position: absolute; left: 0; top: 0; width: 20px; height: 12px; background: #e8c547; transform-origin: 0px 0px; transform: translate(4px, 5px) rotate(12deg); }
    #footer { display: flex; height: 52px; margin-top: 18px; background: #f0d98a; }
    #status { width: 360px; padding: 13px 14px; color: #443510; }
    #action { width: 192px; padding: 13px 14px; color: #ffffff; background: #344f73; text-align: center; }
  </style>
</head>
<body>
  <main id="stage">
    <section id="panel">
      <header id="header">
        <h1 id="title">Renderer parity</h1>
        <p id="subtitle">The same document is rendered by Chromium, DX11 and Slate.</p>
      </header>
      <section id="grid">
        <article class="tile" id="tile-a"><p class="tile-label">Latency</p><p class="tile-value">16 ms</p></article>
        <article class="tile" id="tile-b"><p class="tile-label">Errors</p><p class="tile-value">02</p></article>
        <article class="tile" id="tile-c"><p class="tile-label">Frames</p><p class="tile-value">120</p><div id="clip-outer"><div id="clip-inner"><div id="clip-strip"></div><div id="transform-chip"></div></div></div></article>
      </section>
      <footer id="footer"><div id="status">Deterministic visual fixture</div><div id="action">Compare</div></footer>
    </section>
  </main>
</body>
</html>
