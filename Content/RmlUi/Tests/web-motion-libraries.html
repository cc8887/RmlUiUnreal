<html>
<head>
    <title>Web Motion Library Compatibility</title>
    <link type="text/css" href="web-motion-libraries.css" />
</head>
<body>
    <div id="scrim">
        <div id="magic-popup" class="magic-puff-in">
            <div class="popup-title">Publish changes?</div>
            <div class="popup-copy">The modal uses Magic.css puffIn keyframes.</div>
            <div class="popup-actions">
                <button class="secondary">Cancel</button>
                <button class="primary">Publish</button>
            </div>
        </div>
    </div>
    <div id="motion-dropdown" class="dropdown-demo">
        <button id="dropdown-trigger" class="dropdown-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
            <span>Motion menu</span>
            <span class="dropdown-trigger-mark">+</span>
        </button>
        <div id="dropdown-menu" class="t-dropdown" data-origin="top-left">
            <div id="dropdown-surface" class="dropdown-surface">
                <div class="dropdown-heading">Transitions.dev</div>
                <div class="dropdown-option">Card resize <span>01</span></div>
                <div class="dropdown-option">Menu dropdown <span>05</span></div>
                <div class="dropdown-option">Panel reveal <span>07</span></div>
            </div>
        </div>
    </div>
    <button id="hover-grow" class="hover-grow">Hover.css Grow</button>
    <div class="caption">RmlUi-adapted library effects</div>
</body>
</html>
