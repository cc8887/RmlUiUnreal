<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #eef1f5; color: #363636; font-family: LatoLatin; font-size: 18px; }
    .stage { width: 100%; height: 100%; padding: 48px; box-sizing: border-box; }
    .card { width: 520px; background-color: #ffffff; border-radius: 8px; box-shadow: 18px 24px 36px #0009; overflow: hidden; }
    .card-header { min-height: 64px; display: flex; align-items: center; background-color: #f8fafc; border-bottom: 1px #d8dee8; }
    .card-header-title { flex-grow: 1; margin: 0; padding: 18px 22px; color: #24324a; font-size: 22px; font-weight: bold; }
    .card-content { padding: 24px 22px; line-height: 1.5; }
    .eyebrow { margin: 0 0 10px 0; color: #3273dc; font-size: 14px; }
    .copy { margin: 0; color: #4a4a4a; }
    .card-footer { min-height: 56px; display: flex; border-top: 1px #d8dee8; }
    .card-footer-item { width: 50%; padding: 17px 20px; box-sizing: border-box; color: #3273dc; text-align: center; text-decoration: none; }
    .card-footer-item + .card-footer-item { border-left: 1px #d8dee8; }
  </style>
</head>
<body>
  <main class="stage">
    <article class="card" id="bulma-card">
      <header class="card-header" id="card-header">
        <p class="card-header-title">Deployment status</p>
      </header>
      <div class="card-content" id="card-content">
        <p class="eyebrow">BULMA CARD</p>
        <p class="copy">The release candidate passed validation and is ready for review.</p>
      </div>
      <footer class="card-footer" id="card-footer">
        <a class="card-footer-item" id="details">Details</a>
        <a class="card-footer-item" id="approve">Approve</a>
      </footer>
    </article>
  </main>
</body>
</html>
