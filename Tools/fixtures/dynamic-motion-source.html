<html>
<head>
    <title>Dynamic Web Motion Compatibility</title>
    <style>
        body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: LatoLatin; font-size: 16px; color: #172327; background-color: #182326; }
        #scrim { position: absolute; left: 0; top: 0; width: 430px; height: 480px; background-color: #0b1113b8; }
        #magic-popup { position: absolute; left: 70px; top: 112px; width: 290px; height: 190px; padding: 25px; border-radius: 6px; background-color: #f5f8f7; box-shadow: 0 14px 30px #0008; }
        .popup-title { font-size: 23px; font-weight: bold; }
        .popup-copy { margin-top: 15px; color: #526267; }
        .popup-actions { margin-top: 31px; text-align: right; }
        button { height: 42px; padding: 9px 18px; border: 0; border-radius: 4px; font-family: LatoLatin; font-size: 15px; color: #eaf7f3; background-color: #168a70; }
        .secondary { margin-right: 8px; color: #344448; background-color: #dfe7e5; }
        #hover-grow { position: absolute; left: 525px; top: 194px; width: 180px; height: 56px; }
        .caption { position: absolute; left: 493px; top: 274px; width: 245px; text-align: center; color: #a9babd; }

        /* Unmodified declaration patterns from Magic.css 1.4.8. */
        .magictime {
            -webkit-animation-duration: 1s;
            animation-duration: 1s;
            -webkit-animation-fill-mode: both;
            animation-fill-mode: both;
        }
        .puffIn {
            -webkit-animation-name: puffIn;
            animation-name: puffIn;
        }
        @-webkit-keyframes puffIn {
            0% { opacity: 0; transform-origin: 50% 50%; transform: scale(2, 2); filter: blur(2px); }
            100% { opacity: 1; transform-origin: 50% 50%; transform: scale(1, 1); filter: blur(0px); }
        }
        @keyframes puffIn {
            0% { opacity: 0; transform-origin: 50% 50%; transform: scale(2, 2); filter: blur(2px); }
            100% { opacity: 1; transform-origin: 50% 50%; transform: scale(1, 1); filter: blur(0px); }
        }

        /* Unmodified declaration patterns from Hover.css 2.1.1. */
        .hvr-grow {
            display: inline-block;
            vertical-align: middle;
            -webkit-transform: perspective(1px) translateZ(0);
            transform: perspective(1px) translateZ(0);
            box-shadow: 0 0 1px transparent;
            -webkit-transition-duration: 0.3s;
            transition-duration: 0.3s;
            -webkit-transition-property: transform;
            transition-property: transform;
        }
        .hvr-grow:hover, .hvr-grow:focus, .hvr-grow:active {
            -webkit-transform: scale(1.1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="scrim">
        <div id="magic-popup" class="magictime puffIn">
            <div class="popup-title">Publish changes?</div>
            <div class="popup-copy">Raw LLM-style HTML compiled after LoadDocumentFromString.</div>
            <div class="popup-actions">
                <button class="secondary">Cancel</button>
                <button class="primary">Publish</button>
            </div>
        </div>
    </div>
    <button id="hover-grow" class="hvr-grow">Hover.css Grow</button>
    <div class="caption">Compiled inside Unreal at runtime</div>
</body>
</html>
